name: MySQL integration checks

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/mysql-integration.yml'
  push:
    branches: ['feat/**']
    paths:
      - 'backend/**'
      - '.github/workflows/mysql-integration.yml'
  workflow_dispatch:

jobs:
  mysql-migrations-and-concurrency:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root-test-password
          MYSQL_DATABASE: seatflow
          MYSQL_USER: seatflow
          MYSQL_PASSWORD: seatflow-test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot-test-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: mysql+pymysql://seatflow:seatflow-test-password@127.0.0.1:3306/seatflow
      JWT_SECRET_KEY: test-only-secret-key-that-is-long-enough-for-seatflow
      PYTHONPATH: ${{ github.workspace }}/backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Apply complete Alembic migration chain to MySQL
        run: alembic upgrade head
      - name: Verify Alembic reached head
        run: alembic current
      - name: Run MySQL integration checks
        run: pytest -q tests/test_mysql_concurrency.py
